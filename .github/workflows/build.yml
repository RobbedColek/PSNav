name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Version stamped into the application, e.g. 1.2.3 or 0.0.0-nightly'
        required: true
        type: string
      asset-label:
        description: 'Optional label inserted into asset names, e.g. v1.2.3 gives PSNav-v1.2.3-<rid>.<ext>'
        required: false
        type: string
        default: ''

env:
  PROJECT: src/PSNav.csproj
  APP_NAME: PSNav

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.112'

      # Single file, self-contained and ReadyToRun are configured in the Release group of the project.
      - name: Publish
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          -p:DebugType=none
          -p:Version="$VERSION"
          -o publish/${{ matrix.rid }}

      - name: Package
        shell: bash
        env:
          ASSET_LABEL: ${{ inputs.asset-label }}
        run: |
          name="${APP_NAME}${ASSET_LABEL:+-$ASSET_LABEL}-${{ matrix.rid }}"
          if [ "$RUNNER_OS" == "Windows" ]; then
            7z a "${name}.zip" "./publish/${{ matrix.rid }}/${APP_NAME}.exe"
          else
            tar -czf "${name}.tar.gz" -C "publish/${{ matrix.rid }}" "${APP_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: ${{ env.APP_NAME }}*-${{ matrix.rid }}.*
          retention-days: 1
          if-no-files-found: error
